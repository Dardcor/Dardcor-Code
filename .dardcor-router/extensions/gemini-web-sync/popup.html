<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dardcor Gemini Web Sync</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .badge {
      background: rgba(26, 115, 232, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(26, 115, 232, 0.4);
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
    }
    h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }
    p {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
      margin: 0 0 14px 0;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      display: none;
      line-height: 1.4;
    }
    .status.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }
    .status.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
    .cookie-info {
      font-family: monospace;
      font-size: 11px;
      color: #cbd5e1;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>Gemini Web Sync</h3>
    <span class="badge">Dardcor Router</span>
  </div>
  <p>Sinkronkan akun Google Gemini yang sedang login di browser ini ke Dardcor Router secara instan.</p>
  
  <button id="syncBtn">
    <span>⚡ Sync Akun ke Router</span>
  </button>

  <div id="statusBox" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
