name: Build Dardcor Code

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          libglib2.0-0 libgl1-mesa-glx libx11-xcb1 \
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
          libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 \
          libfontconfig1 libdbus-1-3 xvfb \
          libxrandr2 libxcomposite1 libxcursor1 libxi6 \
          libnss3 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 \
          libpulse0 || true

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        python build.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dardcor-${{ matrix.os }}
        path: "dist/Dardcor Code"
