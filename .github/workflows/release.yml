name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: Dardcor-Code-Setup-Windows.exe
          - os: ubuntu-latest
            asset_name: Dardcor-Code-Linux-x86_64.tar.gz
          - os: macos-latest
            asset_name: Dardcor-Code-MacOS.tar.gz

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libglib2.0-0 libgl1-mesa-glx libx11-xcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 \
            libfontconfig1 libdbus-1-3 xvfb \
            libxrandr2 libxcomposite1 libxcursor1 libxi6 \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 \
            libpulse0 || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          python build.py

      - name: Install Inno Setup and build installer (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install innosetup --yes --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        shell: pwsh

      - name: Package Linux (tar.gz)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd dist
          tar -czf "../Dardcor-Code-Linux-x86_64.tar.gz" "Dardcor Code"
          cd ..

      - name: Package MacOS (tar.gz)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          tar -czf "../Dardcor-Code-MacOS.tar.gz" "Dardcor Code"
          cd ..

      - name: Upload Release Asset (Windows)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Dardcor-Code-Setup-Windows.exe
          name: "Dardcor Code ${{ github.ref_name }}"
          body: |
            ## Dardcor Code ${{ github.ref_name }}

            ### Download
            - **Windows**: `Dardcor-Code-Setup-Windows.exe` — Windows Installer
            - **Linux**: `Dardcor-Code-Linux-x86_64.tar.gz` — Extract and run
            - **macOS**: `Dardcor-Code-MacOS.tar.gz` — Extract and run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: Dardcor-Code-Linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset (MacOS)
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: Dardcor-Code-MacOS.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}