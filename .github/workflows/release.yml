name: Release

on:
  push:
    tags:
      - 'v*'
      - 'Dardcor*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Dardcor Code v1.0.0"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 Dardcor Code v1.0.0 Release

            Next-Generation Desktop AI-Powered Code Editor built on Electron, TypeScript, Node.js, and Monaco.

            ### Key Features:
            - **Desktop Workbench**: High-performance visual UI powered by Monaco Editor.
            - **Integrated Terminal**: Interactive PTY Host with xterm.js support.
            - **Multi-Platform Support**: Cross-platform compatibility for Windows, Linux, and macOS.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
