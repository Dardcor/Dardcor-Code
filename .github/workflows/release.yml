name: Dardcor Code Release

on:
  push:
    tags:
      - 'Dardcor-Code-v*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}
  VSCODE_SKIP_NODE_VERSION_CHECK: '1'
  VSCODE_SKIP_PREINSTALL_CHECK: '1'

jobs:
  build-windows:
    name: Build Windows x64 and ARM64
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^(Dardcor-Code-v?|v)', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Invalid release tag: $env:RELEASE_TAG" }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("product.json","utf8"));p.dardcorVersion=process.argv[1];fs.writeFileSync("product.json",JSON.stringify(p,null,"\t")+"\n")' $version

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Download built-in extensions
        run: node --experimental-strip-types ./build/lib/builtInExtensions.ts

      - name: Compile project
        run: npm run compile

      - name: Build Windows packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path win_assets | Out-Null
          foreach ($arch in @('x64', 'arm64')) {
            npm run gulp -- "vscode-win32-$arch"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run gulp -- "vscode-win32-$arch-inno-updater"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run gulp -- "vscode-win32-$arch-user-setup"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $setupDirectory = ".build\win32-$arch\user-setup"
            $setupFiles = @(Get-ChildItem -LiteralPath $setupDirectory -Filter '*.exe' -File)
            if ($setupFiles.Count -ne 1) { throw "Expected one real Inno Setup package in $setupDirectory, found $($setupFiles.Count)." }
            $assetPath = Join-Path 'win_assets' "Dardcor-Code_$($env:RELEASE_VERSION)_$arch-setup.exe"
            Copy-Item -LiteralPath $setupFiles[0].FullName -Destination $assetPath
            $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText("$assetPath.sha256", $hash)
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: win_assets/*
          if-no-files-found: error

  build-linux:
    name: Build Linux x64 and ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        run: |
          version="${RELEASE_TAG#Dardcor-Code-v}"
          version="${version#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release tag: $RELEASE_TAG" >&2; exit 1; }
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("product.json","utf8"));p.dardcorVersion=process.argv[1];fs.writeFileSync("product.json",JSON.stringify(p,null,"\t")+"\n")' "$version"

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libxkbfile-dev libkrb5-dev libsecret-1-dev rpm dpkg fakeroot zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Download built-in extensions
        run: node --experimental-strip-types ./build/lib/builtInExtensions.ts

      - name: Compile project
        run: npm run compile

      - name: Build Linux packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p linux_assets
          for arch in x64 arm64; do
            deb_arch=amd64
            rpm_arch=x86_64
            if [[ "$arch" == arm64 ]]; then deb_arch=arm64; rpm_arch=aarch64; fi
            npm run gulp -- "vscode-linux-$arch"
            npm run gulp -- "vscode-linux-$arch-prepare-deb"
            npm run gulp -- "vscode-linux-$arch-build-deb"
            npm run gulp -- "vscode-linux-$arch-prepare-rpm"
            npm run gulp -- "vscode-linux-$arch-build-rpm"
            app_dir="../Dardcor-Code-linux-$arch"
            test -d "$app_dir"
            deb_source=(.build/linux/deb/"$deb_arch"/deb/*.deb)
            rpm_source=(.build/linux/rpm/"$rpm_arch"/*.rpm)
            [[ ${#deb_source[@]} -eq 1 && -s "${deb_source[0]}" ]]
            [[ ${#rpm_source[@]} -eq 1 && -s "${rpm_source[0]}" ]]
            if [[ "$arch" == x64 ]]; then package_arch=amd64; else package_arch=arm64; fi
            cp "${deb_source[0]}" "linux_assets/Dardcor-Code_${RELEASE_VERSION}_${package_arch}.deb"
            cp "${rpm_source[0]}" "linux_assets/Dardcor-Code_${RELEASE_VERSION}_${rpm_arch}.rpm"
            tar -czf "linux_assets/Dardcor-Code_${RELEASE_VERSION}_${arch}.tar.gz" -C "$app_dir" .
            for asset in linux_assets/*; do
              case "$asset" in *"_${arch}.tar.gz"|*"_${package_arch}.deb"|*"_${rpm_arch}.rpm") sha256sum "$asset" | awk '{print $1}' > "$asset.sha256" ;; esac
            done
          done

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: linux_assets/*
          if-no-files-found: error

  build-macos:
    name: Build macOS x64 and ARM64
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        run: |
          version="${RELEASE_TAG#Dardcor-Code-v}"
          version="${version#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release tag: $RELEASE_TAG" >&2; exit 1; }
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("product.json","utf8"));p.dardcorVersion=process.argv[1];fs.writeFileSync("product.json",JSON.stringify(p,null,"\t")+"\n")' "$version"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Download built-in extensions
        run: node --experimental-strip-types ./build/lib/builtInExtensions.ts

      - name: Compile project
        run: npm run compile

      - name: Build macOS packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mac_assets
          create_dmg() {
            local app_dir="$1"
            local final_dmg="$2"
            local attempt_dmg
            local attempt

            for attempt in 1 2 3; do
              attempt_dmg="${final_dmg%.dmg}.attempt-${attempt}.dmg"
              rm -f "$attempt_dmg"

              if hdiutil create -volname "Dardcor Code" -srcfolder "$app_dir" -ov -format UDZO "$attempt_dmg" \
                && [[ -s "$attempt_dmg" ]] \
                && hdiutil verify "$attempt_dmg"; then
                mv "$attempt_dmg" "$final_dmg"
                return 0
              fi

              rm -f "$attempt_dmg"
              if [[ "$attempt" -lt 3 ]]; then
                echo "DMG creation attempt $attempt failed; retrying after a short delay."
                sleep "$((attempt * 5))"
              fi
            done

            echo "Failed to create a valid DMG for $app_dir after 3 attempts." >&2
            return 1
          }

          for arch in x64 arm64; do
            npm run gulp -- "vscode-darwin-$arch"
            app="../Dardcor-Code-darwin-$arch/Dardcor Code.app"
            test -d "$app"
            dmg="mac_assets/Dardcor-Code_${RELEASE_VERSION}_${arch}.dmg"
            zip="mac_assets/Dardcor-Code_${RELEASE_VERSION}_${arch}.zip"
            create_dmg "$app" "$dmg"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
            shasum -a 256 "$dmg" | awk '{print $1}' > "$dmg.sha256"
            shasum -a 256 "$zip" | awk '{print $1}' > "$zip.sha256"
          done

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: mac_assets/*
          if-no-files-found: error

  publish-release:
    name: Verify and publish release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: release_assets

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: release_assets

      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          name: macos-packages
          path: release_assets

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate and verify updater manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#Dardcor-Code-v}"
          version="${version#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          node build/generate-updater-json.cjs release_assets "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" "$version"
          node build/verify-release-assets.cjs release_assets "$version"
          echo "RELEASE_TITLE=Dardcor Code v${version}" >> "$GITHUB_ENV"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TITLE }}
          tag_name: ${{ github.ref_name }}
          files: release_assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
