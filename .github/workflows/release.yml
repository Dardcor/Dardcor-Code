name: Build and Release

on:
  push:
    tags:
      - 'v*'

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: Create the GitHub Release
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Dardcor Code ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            ## Dardcor Code ${{ github.ref_name }}

            Release resmi Dardcor Code — Full Desktop AI Coding Assistant.

            ### 📥 Download

            | Platform | File | Keterangan |
            |----------|------|-----------|
            | 🪟 Windows | `Dardcor-Code-Setup-Windows.exe` | Windows Installer (direkomendasikan) |
            | 🪟 Windows | `Dardcor-Code-Windows-Portable.zip` | Windows Portable (tanpa install) |
            | 🍎 macOS | `Dardcor-Code-MacOS.dmg` | macOS Disk Image |
            | 🍎 macOS | `Dardcor-Code-MacOS.tar.gz` | macOS Archive |
            | 🐧 Linux | `Dardcor-Code-Linux-x86_64.tar.gz` | Linux Archive (Extract & Run) |
            | 🐧 Linux | `Dardcor-Code-Linux-x86_64.AppImage` | Linux AppImage (Universal) |
            | 🐧 Linux | `Dardcor-Code-Linux-x86_64.deb` | Debian/Ubuntu Package |
            | 🐧 Linux | `Dardcor-Code-Linux-x86_64.rpm` | Fedora/RHEL Package |

            ### ✨ Fitur Utama
            - Monaco Editor (sama seperti VS Code)
            - AI Agent terintegrasi (Gemini, GPT, Claude, DeepSeek, Ollama)
            - Terminal terintegrasi
            - File Explorer & Git integration
            - Multi-language syntax highlighting
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ─────────────────────────────────────────────────────────────────────────────
# Job 2: Windows Build → .exe Installer + .zip Portable
# Fix: PySide6 terbaru tersedia, pywinpty opsional, gunakan Inno Setup Action
# ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # Install PySide6 latest stable + pyinstaller
          pip install PySide6 requests pyinstaller
          # pywinpty: optional, needed for terminal bundling
          pip install pywinpty
          Write-Host "Dependencies installed successfully"

      - name: Build with PyInstaller
        shell: pwsh
        run: python build.py

      - name: Install Inno Setup and build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: installer.iss
          options: /O+

      - name: Package Windows Portable (.zip)
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\Dardcor Code\*" -DestinationPath "Dardcor-Code-Windows-Portable.zip"
          Write-Host "Portable zip created"

      - name: Upload Windows Installer
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/Dardcor-Code-Setup-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Portable
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: Dardcor-Code-Windows-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ─────────────────────────────────────────────────────────────────────────────
# Job 3: Linux Build → .tar.gz + .AppImage + .deb + .rpm
# ─────────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libglib2.0-0 libgl1-mesa-glx libx11-xcb1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libfontconfig1 libdbus-1-3 libxrandr2 \
            libxcomposite1 libxcursor1 libxi6 libnss3 \
            libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 libpulse0 \
            fakeroot ruby ruby-dev rubygems rpm || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 requests pyinstaller

      - name: Build with PyInstaller
        run: python build.py

      - name: Package tar.gz
        run: |
          tar -czf Dardcor-Code-Linux-x86_64.tar.gz -C dist "Dardcor Code"
          echo "tar.gz created"

      - name: Package AppImage
        run: |
          APP_DIR="AppDir"
          mkdir -p "$APP_DIR/usr/bin"
          cp -r "dist/Dardcor Code/"* "$APP_DIR/usr/bin/"

          cat > "$APP_DIR/dardcor-code.desktop" << 'DESKTOP'
          [Desktop Entry]
          Name=Dardcor Code
          Exec=Dardcor Code
          Icon=dardcor
          Type=Application
          Categories=Development;IDE;
          Comment=Full Desktop AI Coding Assistant
          DESKTOP

          if [ -f "image/dardcor.png" ]; then
            cp "image/dardcor.png" "$APP_DIR/dardcor.png"
          fi

          cat > "$APP_DIR/AppRun" << 'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/Dardcor Code" "$@"
          APPRUN
          chmod +x "$APP_DIR/AppRun"

          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run "$APP_DIR" "Dardcor-Code-Linux-x86_64.AppImage"
          echo "AppImage created"
        continue-on-error: true

      - name: Package .deb
        run: |
          APP_VERSION="${{ github.ref_name }}"
          APP_VERSION="${APP_VERSION#v}"
          DEB_DIR="deb_package"

          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/opt/dardcor-code"
          mkdir -p "$DEB_DIR/usr/local/bin"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"

          cp -r "dist/Dardcor Code/"* "$DEB_DIR/opt/dardcor-code/"

          cat > "$DEB_DIR/usr/local/bin/dardcor-code" << 'LAUNCHER'
          #!/bin/sh
          exec /opt/dardcor-code/"Dardcor Code" "$@"
          LAUNCHER
          chmod +x "$DEB_DIR/usr/local/bin/dardcor-code"

          cat > "$DEB_DIR/usr/share/applications/dardcor-code.desktop" << 'DESKTOP'
          [Desktop Entry]
          Name=Dardcor Code
          Exec=/opt/dardcor-code/Dardcor Code
          Icon=dardcor
          Type=Application
          Categories=Development;IDE;
          Comment=Full Desktop AI Coding Assistant
          DESKTOP

          if [ -f "image/dardcor.png" ]; then
            cp "image/dardcor.png" "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/dardcor.png"
          fi

          cat > "$DEB_DIR/DEBIAN/control" << CONTROL
          Package: dardcor-code
          Version: $APP_VERSION
          Architecture: amd64
          Maintainer: Dardcor Team <support@dardcor.com>
          Description: Dardcor Code - Full Desktop AI Coding Assistant
           AI-powered coding assistant with Monaco Editor, terminal, and Git integration.
          Section: devel
          Priority: optional
          CONTROL

          dpkg-deb --build "$DEB_DIR" "Dardcor-Code-Linux-x86_64.deb"
          echo ".deb created"
        continue-on-error: true

      - name: Package .rpm
        run: |
          APP_VERSION="${{ github.ref_name }}"
          APP_VERSION="${APP_VERSION#v}"
          sudo gem install fpm --no-document 2>/dev/null || true
          if command -v fpm &> /dev/null; then
            fpm -s dir -t rpm \
              -n "dardcor-code" \
              -v "$APP_VERSION" \
              --architecture x86_64 \
              --description "Dardcor Code - Full Desktop AI Coding Assistant" \
              --maintainer "Dardcor Team" \
              --url "https://github.com/Dardcor/Dardcor-Code" \
              --license "MIT" \
              "dist/Dardcor Code/=/opt/dardcor-code/" \
              --package "Dardcor-Code-Linux-x86_64.rpm"
            echo ".rpm created"
          else
            echo "fpm not available, skipping rpm"
          fi
        continue-on-error: true

      - name: Upload Linux tar.gz
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: Dardcor-Code-Linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux AppImage
        if: hashFiles('Dardcor-Code-Linux-x86_64.AppImage') != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: Dardcor-Code-Linux-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux .deb
        if: hashFiles('Dardcor-Code-Linux-x86_64.deb') != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: Dardcor-Code-Linux-x86_64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux .rpm
        if: hashFiles('Dardcor-Code-Linux-x86_64.rpm') != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: Dardcor-Code-Linux-x86_64.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ─────────────────────────────────────────────────────────────────────────────
# Job 4: macOS Build → .dmg + .tar.gz
# Fix: macos-13 (Intel x86_64) untuk PySide6 + PyInstaller compatibility
# ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS
    needs: create-release
    # macos-13 = Intel x86_64, WAJIB untuk PySide6+PyInstaller
    # macos-14/15 = ARM64, belum stabil untuk PySide6 PyInstaller bundling
    runs-on: macos-13
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 requests pyinstaller

      - name: Build with PyInstaller
        run: python build.py

      - name: Package tar.gz
        run: |
          tar -czf Dardcor-Code-MacOS.tar.gz -C dist "Dardcor Code"
          echo "tar.gz created"

      - name: Package .dmg
        run: |
          hdiutil create \
            -volname "Dardcor Code" \
            -srcfolder "dist/Dardcor Code" \
            -ov \
            -format UDZO \
            "Dardcor-Code-MacOS.dmg"
          echo "DMG created"
        continue-on-error: true

      - name: Upload macOS tar.gz
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: Dardcor-Code-MacOS.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS DMG
        if: hashFiles('Dardcor-Code-MacOS.dmg') != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: Dardcor-Code-MacOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}