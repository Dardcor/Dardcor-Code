name: Build and Release Windows

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Run Build Script
        run: |
          python build.py

      - name: Compress Executable Folder
        # Compress the output folder from PyInstaller into a single ZIP file for release
        run: |
          Compress-Archive -Path "dist/Dardcor Code" -DestinationPath "Dardcor-Code-Windows.zip"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: Dardcor-Code-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
