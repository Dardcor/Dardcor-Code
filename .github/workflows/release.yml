name: Release Multi-OS Complete Build

on:
  push:
    tags:
      - 'v*'
      - 'Dardcor*'
  workflow_dispatch:

permissions:
  contents: write

env:
  VSCODE_SKIP_NODE_VERSION_CHECK: '1'
  VSCODE_SKIP_PREINSTALL_CHECK: '1'

jobs:
  build-win32-x64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Project Dependencies
        run: npm install

      - name: Pre-download Built-in Extensions
        run: node --experimental-strip-types ./build/lib/builtInExtensions.ts

      - name: Build Windows Standalone Package
        run: node --experimental-strip-types --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js --gulpfile build/gulpfile.vscode.ts vscode-win32-x64

      - name: Create Windows Zip Archive (List-OS exact match)
        shell: powershell
        run: |
          Compress-Archive -Path '../VSCode-win32-x64/*' -DestinationPath 'Dardcor.Code_1.0.0_x64.zip' -Force

      - name: Upload Windows Asset to Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Dardcor Code v1.0.0"
          tag_name: ${{ github.ref_name }}
          files: |
            Dardcor.Code_1.0.0_x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbfile-dev libkrb5-dev libsecret-1-dev rpm dpkg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Project Dependencies
        run: npm install

      - name: Pre-download Built-in Extensions
        run: node --experimental-strip-types ./build/lib/builtInExtensions.ts

      - name: Build Linux Standalone Package
        run: node --experimental-strip-types --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js --gulpfile build/gulpfile.vscode.ts vscode-linux-x64

      - name: Create Linux Tarball Archive (List-OS exact match)
        run: |
          tar -czvf Dardcor.Code_x64.app.tar.gz -C ../VSCode-linux-x64 .

      - name: Upload Linux Asset to Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Dardcor Code v1.0.0"
          tag_name: ${{ github.ref_name }}
          files: |
            Dardcor.Code_x64.app.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-darwin-x64:
    name: Build macOS x64
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Project Dependencies
        run: npm install

      - name: Pre-download Built-in Extensions
        run: node --experimental-strip-types ./build/lib/builtInExtensions.ts

      - name: Build macOS Standalone Package
        run: node --experimental-strip-types --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js --gulpfile build/gulpfile.vscode.ts vscode-darwin-x64

      - name: Create macOS Tarball Archive (List-OS exact match)
        run: |
          tar -czvf Dardcor.Code_x64.app.tar.gz -C ../VSCode-darwin-x64 .

      - name: Upload macOS Asset to Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Dardcor Code v1.0.0"
          tag_name: ${{ github.ref_name }}
          files: |
            Dardcor.Code_x64.app.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
