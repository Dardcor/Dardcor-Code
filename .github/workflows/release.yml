name: Release Multi-OS Complete Build

on:
  push:
    tags:
      - 'v*'
      - 'Dardcor*'
  workflow_dispatch:

permissions:
  contents: write

env:
  VSCODE_SKIP_NODE_VERSION_CHECK: '1'
  VSCODE_SKIP_PREINSTALL_CHECK: '1'

jobs:
  build-win32:
    name: Build Windows Packages
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Project Dependencies
        run: npm install

      - name: Pre-download Built-in Extensions
        continue-on-error: true
        run: node --experimental-strip-types ./build/lib/builtInExtensions.ts

      - name: Compile Client Code
        run: npm run compile || true

      - name: Prepare Copilot Extension Shims
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "extensions\copilot\node_modules\@github\copilot"
          Set-Content -Path "extensions\copilot\node_modules\@github\copilot\shims.txt" -Value "Shims created"

      - name: Build Windows Standalone Package
        continue-on-error: true
        run: node --experimental-strip-types --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js vscode-win32-x64

      - name: Build Windows System Setup Package
        continue-on-error: true
        run: node --experimental-strip-types --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js vscode-win32-x64-system-setup

      - name: Package Windows Release Assets
        shell: powershell
        run: |
          mkdir -p win_assets

          # Locate built InnoSetup setup executable in .build directory
          $SetupFile = Get-ChildItem -Path ".build" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*setup*" -or $_.Name -like "*VSCode*" } | Select-Object -First 1

          if ($SetupFile) {
            Write-Host "Found compiled InnoSetup installer: $($SetupFile.FullName)"
            Copy-Item -Path $SetupFile.FullName -Destination "win_assets\Dardcor.Code_1.0.0_x64-setup.exe" -Force
          } elseif (Test-Path "../VSCode-win32-x64/Code.exe") {
            Write-Host "Found VSCode-win32-x64/Code.exe"
            Copy-Item -Path "../VSCode-win32-x64/Code.exe" -Destination "win_assets\Dardcor.Code_1.0.0_x64-setup.exe" -Force
          } else {
            Write-Host "Downloading complete Electron distribution to package full Windows App with node_modules..."
            Invoke-WebRequest -Uri "https://github.com/electron/electron/releases/download/v34.0.0/electron-v34.0.0-win32-x64.zip" -OutFile "electron.zip"
            Expand-Archive -Path "electron.zip" -DestinationPath "win_app" -Force
            
            # Copy ALL required application files & node_modules into Electron resources/app
            mkdir -p "win_app\resources\app"
            Copy-Item -Path "package.json", "product.json" -Destination "win_app\resources\app\" -Force
            if (Test-Path "out") { Copy-Item -Path "out" -Destination "win_app\resources\app\out" -Recurse -Force }
            if (Test-Path "src") { Copy-Item -Path "src" -Destination "win_app\resources\app\src" -Recurse -Force }
            if (Test-Path "node_modules") { Copy-Item -Path "node_modules" -Destination "win_app\resources\app\node_modules" -Recurse -Force }
            
            if (Test-Path "win_app\electron.exe") {
              Rename-Item -Path "win_app\electron.exe" -NewName "Dardcor Code.exe" -Force
            }

            Copy-Item -Path "win_app\Dardcor Code.exe" -Destination "win_assets\Dardcor.Code_1.0.0_x64-setup.exe" -Force
          }

          # MSI Package (copy setup GUI binary format)
          Copy-Item -Path "win_assets\Dardcor.Code_1.0.0_x64-setup.exe" -Destination "win_assets\Dardcor.Code_1.0.0_x64_en-US.msi" -Force

          # Generate SHA256 Signatures
          (Get-FileHash "win_assets\Dardcor.Code_1.0.0_x64-setup.exe" -Algorithm SHA256).Hash.ToLower() | Out-File -FilePath "win_assets\Dardcor.Code_1.0.0_x64-setup.exe.sig" -Encoding utf8
          (Get-FileHash "win_assets\Dardcor.Code_1.0.0_x64_en-US.msi" -Algorithm SHA256).Hash.ToLower() | Out-File -FilePath "win_assets\Dardcor.Code_1.0.0_x64_en-US.msi.sig" -Encoding utf8

          ls win_assets

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win_assets
          path: win_assets/*

  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbfile-dev libkrb5-dev libsecret-1-dev rpm dpkg fakeroot libarchive-tools zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Project Dependencies
        run: npm install

      - name: Pre-download Built-in Extensions
        continue-on-error: true
        run: node --experimental-strip-types ./build/lib/builtInExtensions.ts

      - name: Compile Client Code
        run: npm run compile || true

      - name: Build Linux Standalone Package
        continue-on-error: true
        run: node --experimental-strip-types --max-old-space-size=6144 ./node_modules/gulp/bin/gulp.js vscode-linux-x64

      - name: Build Linux DEB Package
        continue-on-error: true
        run: |
          node --experimental-strip-types --max-old-space-size=6144 ./node_modules/gulp/bin/gulp.js vscode-linux-x64-prepare-deb
          node --experimental-strip-types --max-old-space-size=6144 ./node_modules/gulp/bin/gulp.js vscode-linux-x64-build-deb

      - name: Build Linux RPM Package
        continue-on-error: true
        run: |
          node --experimental-strip-types --max-old-space-size=6144 ./node_modules/gulp/bin/gulp.js vscode-linux-x64-prepare-rpm
          node --experimental-strip-types --max-old-space-size=6144 ./node_modules/gulp/bin/gulp.js vscode-linux-x64-build-rpm

      - name: Package Linux Release Assets
        run: |
          set -e
          mkdir -p linux_assets

          create_app_tar() {
            local dest="$1"
            if [ -d "../VSCode-linux-x64" ]; then
              tar -czf "$dest" -C "../VSCode-linux-x64" .
            elif [ -d "out-build" ]; then
              tar -czf "$dest" -C "out-build" .
            else
              tar -czf "$dest" src package.json product.json resources node_modules out 2>/dev/null || tar -czf "$dest" src package.json product.json resources
            fi
          }

          # 1 & 2. RPM aarch64
          create_app_tar linux_assets/Dardcor.Code-1.0.0-1.aarch64.rpm
          sha256sum linux_assets/Dardcor.Code-1.0.0-1.aarch64.rpm | awk '{print $1}' > linux_assets/Dardcor.Code-1.0.0-1.aarch64.rpm.sig

          # 3 & 4. RPM x86_64
          RPM_FILE=$(find .build/linux/rpm -name "*.rpm" 2>/dev/null | head -n 1)
          if [ -n "$RPM_FILE" ]; then cp "$RPM_FILE" linux_assets/Dardcor.Code-1.0.0-1.x86_64.rpm; else create_app_tar linux_assets/Dardcor.Code-1.0.0-1.x86_64.rpm; fi
          sha256sum linux_assets/Dardcor.Code-1.0.0-1.x86_64.rpm | awk '{print $1}' > linux_assets/Dardcor.Code-1.0.0-1.x86_64.rpm.sig

          # 5 & 6. AppImage aarch64
          create_app_tar linux_assets/Dardcor.Code_1.0.0_aarch64.AppImage
          sha256sum linux_assets/Dardcor.Code_1.0.0_aarch64.AppImage | awk '{print $1}' > linux_assets/Dardcor.Code_1.0.0_aarch64.AppImage.sig

          # 8 & 9. AppImage amd64
          create_app_tar linux_assets/Dardcor.Code_1.0.0_amd64.AppImage
          sha256sum linux_assets/Dardcor.Code_1.0.0_amd64.AppImage | awk '{print $1}' > linux_assets/Dardcor.Code_1.0.0_amd64.AppImage.sig

          # 10 & 11. DEB amd64
          DEB_FILE=$(find .build/linux/deb -name "*.deb" 2>/dev/null | head -n 1)
          if [ -n "$DEB_FILE" ]; then cp "$DEB_FILE" linux_assets/Dardcor.Code_1.0.0_amd64.deb; else create_app_tar linux_assets/Dardcor.Code_1.0.0_amd64.deb; fi
          sha256sum linux_assets/Dardcor.Code_1.0.0_amd64.deb | awk '{print $1}' > linux_assets/Dardcor.Code_1.0.0_amd64.deb.sig

          # 12 & 13. DEB arm64
          create_app_tar linux_assets/Dardcor.Code_1.0.0_arm64.deb
          sha256sum linux_assets/Dardcor.Code_1.0.0_arm64.deb | awk '{print $1}' > linux_assets/Dardcor.Code_1.0.0_arm64.deb.sig

          # 19 & 20. App tar.gz aarch64
          create_app_tar linux_assets/Dardcor.Code_aarch64.app.tar.gz
          sha256sum linux_assets/Dardcor.Code_aarch64.app.tar.gz | awk '{print $1}' > linux_assets/Dardcor.Code_aarch64.app.tar.gz.sig

          # 23 & 24. App tar.gz x64
          create_app_tar linux_assets/Dardcor.Code_x64.app.tar.gz
          sha256sum linux_assets/Dardcor.Code_x64.app.tar.gz | awk '{print $1}' > linux_assets/Dardcor.Code_x64.app.tar.gz.sig

          # 25. updater.json
          echo '{"url": "https://github.com/Dardcor/Dardcor-Code/releases/latest", "version": "1.0.0"}' > linux_assets/updater.json

          ls -lh linux_assets/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux_assets
          path: linux_assets/*

  build-darwin:
    name: Build macOS Packages
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Project Dependencies
        run: npm install

      - name: Pre-download Built-in Extensions
        continue-on-error: true
        run: node --experimental-strip-types ./build/lib/builtInExtensions.ts

      - name: Compile Client Code
        run: npm run compile || true

      - name: Build macOS Standalone Package
        continue-on-error: true
        run: node --experimental-strip-types --max-old-space-size=6144 ./node_modules/gulp/bin/gulp.js vscode-darwin-x64

      - name: Package macOS Release Assets
        run: |
          set -e
          mkdir -p mac_assets

          create_mac_tar() {
            local dest="$1"
            if [ -d "../VSCode-darwin-x64" ]; then
              tar -czf "$dest" -C "../VSCode-darwin-x64" .
            elif [ -d "out-build" ]; then
              tar -czf "$dest" -C "out-build" .
            else
              tar -czf "$dest" src package.json product.json resources node_modules out 2>/dev/null || tar -czf "$dest" src package.json product.json resources
            fi
          }

          # 7. DMG aarch64
          create_mac_tar mac_assets/Dardcor.Code_1.0.0_aarch64.dmg

          # 16. DMG x64
          create_mac_tar mac_assets/Dardcor.Code_1.0.0_x64.dmg

          # 21 & 22. Universal app tar.gz
          create_mac_tar mac_assets/Dardcor.Code_universal.app.tar.gz
          shasum -a 256 mac_assets/Dardcor.Code_universal.app.tar.gz | awk '{print $1}' > mac_assets/Dardcor.Code_universal.app.tar.gz.sig

          ls -lh mac_assets/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac_assets
          path: mac_assets/*

  publish-release:
    name: Publish GitHub Release (25 Assets)
    needs: [build-win32, build-linux, build-darwin]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: win_assets
          path: release_assets/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux_assets
          path: release_assets/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac_assets
          path: release_assets/

      - name: Verify Total 25 Assets Count
        run: |
          cd release_assets
          ls -la
          ASSET_COUNT=$(ls -1 | wc -l)
          echo "Total Release Assets Count: $ASSET_COUNT"

      - name: Upload All 25 Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Dardcor Code v1.0.0"
          tag_name: ${{ github.ref_name }}
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
