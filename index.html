<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dardcor Code</title>
	<link rel="icon" type="image/png" href="./public/dardcor-code.png">
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100vw;
			height: 100vh;
			overflow: hidden;
			background-color: #1e1e1e;
			color: #cccccc;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			user-select: none;
		}

		/* VS Code Style Custom UI Rules */
		.dc-workbench {
			display: flex;
			flex-direction: column;
			width: 100vw;
			height: 100vh;
		}

		.dc-part-titlebar {
			height: 32px;
			background: #323233;
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 0 10px;
			font-size: 12px;
			border-bottom: 1px solid #2b2b2b;
		}

		.dc-part-mainbody {
			flex: 1;
			display: flex;
			overflow: hidden;
		}

		.dc-part-activitybar {
			width: 48px;
			background: #333333;
			display: flex;
			flex-direction: column;
			align-items: center;
			padding-top: 8px;
			gap: 16px;
			border-right: 1px solid #252526;
		}

		.dc-activity-icon {
			width: 32px;
			height: 32px;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			opacity: 0.6;
			transition: opacity 0.2s;
			border-radius: 4px;
		}

		.dc-activity-icon:hover, .dc-activity-icon.active {
			opacity: 1;
			background: #3c3c3c;
		}

		.dc-part-sidebar {
			width: 260px;
			background: #252526;
			border-right: 1px solid #1e1e1e;
			display: flex;
			flex-direction: column;
		}

		.dc-part-center {
			flex: 1;
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}

		.dc-part-editor {
			flex: 1;
			position: relative;
			background: #1e1e1e;
		}

		.dc-part-panel {
			height: 180px;
			background: #1e1e1e;
			border-top: 1px solid #2b2b2b;
			display: flex;
			flex-direction: column;
		}

		.dc-part-statusbar {
			height: 22px;
			background: #007acc;
			color: #ffffff;
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 0 10px;
			font-size: 12px;
		}
	</style>
</head>
<body>
	<script type="module" src="./dist/dc/main.js"></script>
</body>
</html>
