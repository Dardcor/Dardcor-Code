<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="xterm.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000000; }
        #terminal { width: 100%; height: 100%; padding: 4px 0px 4px 8px; }

        ::-webkit-scrollbar { width: 14px; height: 14px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border: 4px solid transparent; background-clip: padding-box; min-height: 20px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); border: 4px solid transparent; background-clip: padding-box; }
        ::-webkit-scrollbar-corner { background: transparent; }

        #terminal-wrap { position: relative; width: 100%; height: 100%; }
        #find-bar {
            display: none;
            position: absolute;
            top: 4px;
            right: 8px;
            z-index: 10;
            align-items: center;
            gap: 4px;
            padding: 4px 6px;
            background: #252526;
            border: 1px solid #454545;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.36);
        }
        #find-bar.visible { display: flex; }
        #find-bar input {
            width: 180px;
            background: #3c3c3c;
            color: #cccccc;
            border: 1px solid #3c3c3c;
            border-radius: 2px;
            padding: 2px 6px;
            font-size: 12px;
            font-family: "Segoe UI", sans-serif;
            outline: none;
        }
        #find-bar input:focus { border-color: #007acc; }
        #find-bar button {
            background: transparent;
            color: #cccccc;
            border: none;
            border-radius: 2px;
            padding: 2px 6px;
            font-size: 12px;
            cursor: pointer;
        }
        #find-bar button:hover { background: rgba(255, 255, 255, 0.1); }
        #find-count {
            color: #858585;
            font-size: 11px;
            min-width: 40px;
            text-align: center;
        }
        .xterm-find-result-decoration { background-color: rgba(234, 92, 0, 0.33); }
        .xterm-find-active-result-decoration { background-color: rgba(234, 92, 0, 0.55); outline: 1px solid #ea5c00; }

        #link-hover {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            background: #252526;
            color: #cccccc;
            border: 1px solid #454545;
            border-radius: 3px;
            padding: 2px 8px;
            font-size: 11px;
            font-family: "Segoe UI", sans-serif;
            white-space: nowrap;
            pointer-events: none;
            z-index: 20;
        }
        #link-hover.visible { display: block; }
    </style>
</head>
<body>
    <div id="terminal-wrap">
        <div id="find-bar">
            <input id="find-input" type="text" placeholder="Find" spellcheck="false" />
            <span id="find-count"></span>
            <button id="find-prev" title="Previous Match (Shift+Enter)">&#9650;</button>
            <button id="find-next" title="Next Match (Enter)">&#9660;</button>
            <button id="find-close" title="Close (Escape)">&#10005;</button>
        </div>
        <div id="terminal"></div>
        <div id="link-hover"></div>
    </div>

    <script src="qwebchannel.js"></script>
    <script src="xterm.js"></script>
    <script src="xterm-addon-search.js"></script>
    <script src="xterm-addon-web-links.js"></script>

    <script>
    (function () {
        'use strict';

        var term            = null;
        var searchAddon     = null;
        var webLinksAddon   = null;
        var backend         = null;
        var resizeObs       = null;
        var fitPending      = false;
        var copyOnSelect    = false;

        var findDecorations = {
            matchBackground: '#ea5c004d',
            matchBorder: '#ea5c00',
            matchOverviewRuler: '#ea5c00',
            activeMatchBackground: '#ea5c0088',
            activeMatchBorder: '#ea5c00',
            activeMatchColorOverviewRuler: '#ea5c00'
        };

        /* ── Default theme (VS Code Dark+) ──────────────────── */
        var DEFAULT_THEME = {
            background:         '#000000',
            foreground:         '#cccccc',
            cursor:             '#aeafad',
            cursorAccent:       '#000000',
            selectionBackground:'#264f78',
            black:              '#000000',
            red:                '#cd3131',
            green:              '#0dbc79',
            yellow:             '#e5e510',
            blue:               '#2472c8',
            magenta:            '#bc3fbc',
            cyan:               '#11a8cd',
            white:              '#e5e5e5',
            brightBlack:        '#666666',
            brightRed:          '#f14c4c',
            brightGreen:        '#23d18b',
            brightYellow:       '#f5f543',
            brightBlue:         '#3b8eea',
            brightMagenta:      '#d670d6',
            brightCyan:         '#29b8db',
            brightWhite:        '#e5e5e5'
        };

        var currentTheme = DEFAULT_THEME;

        /* ── URL detection from terminal output ─────────────── */
        var URL_REGEX = /https?:\/\/(www\.)?[-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{1,6}\b([-a-zA-Z0-9()@:%_\+.~#?&//=]*)/gi;
        var linkHoverTimer = null;

        window.showLinkHover = function (text) {
            var el = document.getElementById('link-hover');
            if (el) {
                el.textContent = text;
                el.classList.add('visible');
            }
        };

        window.hideLinkHover = function () {
            var el = document.getElementById('link-hover');
            if (el) { el.classList.remove('visible'); }
        };

        /* ── Create xterm.js terminal ──────────────────────── */
        function createTerminal() {
            term = new Terminal({
                fontFamily: '"Cascadia Code", "Cascadia Mono", Consolas, "Courier New", monospace',
                fontSize:   13,
                lineHeight: 1.2,
                cursorBlink:       true,
                cursorStyle:       'block',
                scrollback:        10000,
                convertEol:        false,
                allowProposedApi:  true,
                theme: currentTheme
            });

            var container = document.getElementById('terminal');
            term.open(container);

            /* ── Load SearchAddon ──────────────────────────── */
            if (typeof SearchAddon !== 'undefined') {
                searchAddon = typeof SearchAddon === 'function' ? new SearchAddon() : new SearchAddon.SearchAddon();
                if (typeof term.loadAddon === 'function') {
                    term.loadAddon(searchAddon);
                } else {
                    searchAddon.activate(term);
                }
            }

            setupFindBar();

            /* ── Load WebLinksAddon ────────────────────────── */
            if (typeof WebLinksAddon !== 'undefined') {
                webLinksAddon = typeof WebLinksAddon === 'function' ? new WebLinksAddon() : new WebLinksAddon.WebLinksAddon();
                if (typeof term.loadAddon === 'function') {
                    term.loadAddon(webLinksAddon);
                } else {
                    webLinksAddon.activate(term);
                }
            }

            /* ── Fit terminal ────────────────────────────── */
            scheduleFit();

            if (typeof ResizeObserver !== 'undefined') {
                resizeObs = new ResizeObserver(function () { scheduleFit(); });
                resizeObs.observe(container);
            }
            window.addEventListener('resize', function () { scheduleFit(); });

            /* ── Expose write function for Python → xterm ───── */
            window.writeToTerminal = function (data) {
                if (term) {
                    term.write(data);
                    // Scroll to bottom on new output
                    term.scrollToBottom();
                }
            };

            window.setTheme = function (themeJson) {
                if (!term) return;
                try {
                    var colors = typeof themeJson === 'string' ? JSON.parse(themeJson) : themeJson;
                    if (typeof colors === 'string') {
                        colors = JSON.parse(colors);
                    }
                    var newTheme = Object.assign({}, DEFAULT_THEME, colors);
                    currentTheme = newTheme;
                    term.options.theme = newTheme;
                    document.body.style.background = newTheme.background || '#000000';
                } catch (e) {
                    console.error("Theme set error:", e);
                }
            };

            window.setFont = function (family, size, lineHeight) {
                if (!term) return;
                if (family !== undefined && family !== null) {
                    term.options.fontFamily = family;
                }
                if (size !== undefined && size !== null) {
                    term.options.fontSize = size;
                }
                if (lineHeight !== undefined && lineHeight !== null) {
                    term.options.lineHeight = lineHeight;
                }
                scheduleFit();
            };

            window.setCursorStyle = function (style, blink) {
                if (!term) return;
                if (style !== undefined) { term.options.cursorStyle = style; }
                if (blink !== undefined) { term.options.cursorBlink = blink; }
            };

            window.setScrollback = function (lines) {
                if (!term) return;
                term.options.scrollback = lines;
            };

            window.setCopyOnSelect = function (enabled) {
                copyOnSelect = enabled;
            };

            window.toggleFindBar = function () {
                if (typeof window.showFindBar === 'function') {
                    window.showFindBar();
                }
            };

            /* ── Forward keystrokes xterm → Python ──────────── */
            term.onData(function (data) {
                if (backend) { backend.receive_data(data); }
            });

            /* ── Handle selection changes ─────────────────── */
            term.onSelectionChange(function () {
                var selection = term.getSelection();
                if (backend) {
                    backend.on_selection_change(selection);
                }
            });

            /* ── Attach custom key handlers ────────────────── */
            term.attachCustomKeyEventHandler(function (e) {
                if ((e.ctrlKey || e.metaKey) && e.code === 'KeyF' && e.type === 'keydown') {
                    if (typeof window.showFindBar === 'function') { window.showFindBar(); }
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && e.code === 'KeyC' && e.type === 'keydown') {
                    var selection = term.getSelection();
                    if (selection) {
                        if (backend) { backend.copy_to_clipboard(selection); }
                        term.clearSelection();
                        return false;
                    }
                }
                if ((e.ctrlKey || e.metaKey) && e.code === 'KeyV' && e.type === 'keydown') {
                    if (backend) { backend.request_paste(); }
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && e.code === 'KeyL' && e.type === 'keydown') {
                    if (term) {
                        term.clear();
                        return false;
                    }
                }
                return true;
            });

            /* ── VS Code style right click ────────────────── */
            container.addEventListener('contextmenu', function (e) {
                e.preventDefault();
                var selection = term.getSelection();
                if (selection) {
                    if (backend) { backend.copy_to_clipboard(selection); }
                    term.clearSelection();
                } else {
                    if (backend) { backend.request_paste(); }
                }
            });

            /* ── Handle title change from shell ────────────── */
            if (term.onTitleChange) {
                term.onTitleChange(function (title) {
                    if (backend) { backend.on_title_change(title); }
                });
            }

            /* ── Bell handling ───────────────────────────── */
            if (term.onBell) {
                term.onBell(function () {
                    if (backend) { backend.on_bell(); }
                });
            }

            doFit();
        }

        /* ── Find Bar ──────────────────────────────────────── */
        function setupFindBar() {
            var bar = document.getElementById('find-bar');
            var input = document.getElementById('find-input');
            var countEl = document.getElementById('find-count');
            if (!bar || !input || !searchAddon) { return; }

            function runFind(backward) {
                var text = input.value;
                if (!text || !searchAddon) { return; }
                var opts = { decorations: findDecorations };
                var found = backward
                    ? searchAddon.findPrevious(text, opts)
                    : searchAddon.findNext(text, opts);
                if (countEl) {
                    countEl.textContent = found ? '' : 'No results';
                }
            }

            window.showFindBar = function () {
                bar.classList.add('visible');
                input.focus();
                input.select();
            };

            window.hideFindBar = function () {
                bar.classList.remove('visible');
                if (searchAddon) { searchAddon.clearDecorations(); }
                if (countEl) { countEl.textContent = ''; }
                if (term) { term.focus(); }
            };

            input.addEventListener('input', function () { runFind(false); });
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    runFind(e.shiftKey);
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    hideFindBar();
                }
            });

            document.getElementById('find-prev').addEventListener('click', function () { runFind(true); });
            document.getElementById('find-next').addEventListener('click', function () { runFind(false); });
            document.getElementById('find-close').addEventListener('click', hideFindBar);

            if (searchAddon.onDidChangeResults) {
                searchAddon.onDidChangeResults(function (e) {
                    if (!countEl || !input.value) { return; }
                    if (e.resultCount > 0) {
                        countEl.textContent = (e.resultIndex + 1) + ' of ' + e.resultCount;
                    } else {
                        countEl.textContent = 'No results';
                    }
                });
            }
        }

        /* ── Fit logic ─────────────────────────────────────── */
        function scheduleFit() {
            if (fitPending) { return; }
            fitPending = true;
            requestAnimationFrame(function () {
                fitPending = false;
                doFit();
            });
        }

        function doFit() {
            if (!term || !term.element) { return; }

            var core = term._core;
            if (!core) { return; }

            var renderService = core._renderService;
            if (!renderService) { return; }

            var dims = renderService.dimensions;
            if (!dims) { return; }

            var cellW, cellH;
            if (dims.css && dims.css.cell) {
                cellW = dims.css.cell.width;
                cellH = dims.css.cell.height;
            } else {
                cellW = dims.actualCellWidth;
                cellH = dims.actualCellHeight;
            }

            if (!cellW || !cellH || cellW <= 0 || cellH <= 0) { return; }

            var container = document.getElementById('terminal');
            var availW = container.clientWidth  - 8;
            var availH = container.clientHeight - 8;

            if (availW < 300) { availW = 1000; }
            if (availH < 100) { availH = 400; }

            var cols = Math.max(10, Math.floor(availW / cellW));
            var rows = Math.max(3,  Math.floor(availH / cellH));

            if (cols !== term.cols || rows !== term.rows) {
                try { term.resize(cols, rows); } catch (e) { }
            }

            if (backend) {
                backend.resize_pty(term.cols, term.rows);
            }
        }

        /* ── QWebChannel init ────────────────────────────── */
        function initWebChannel() {
            if (typeof qt === 'undefined' || !qt.webChannelTransport) {
                setTimeout(initWebChannel, 50);
                return;
            }

            new QWebChannel(qt.webChannelTransport, function (channel) {
                backend = channel.objects.backend;
                createTerminal();
            });
        }

        initWebChannel();

    }());
    </script>
</body>
</html>
