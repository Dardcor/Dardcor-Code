[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dardcor-code"
version = "1.0.4"
description = "Full Desktop AI Coding Assistant — VS Code-like IDE with AI pair programming"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Dardcor Team" }
]
keywords = [
    "ai", "agent", "coding-assistant", "claude", "openai",
    "gemini", "deepseek", "ollama", "ide", "editor", "vscode",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: IDEs",
    "Topic :: Software Development :: Code Generators",
]
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.6.0",
    "pywinpty>=2.0.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/Dardcor/dardcor-code"
Repository = "https://github.com/Dardcor/dardcor-code.git"
Issues = "https://github.com/Dardcor/dardcor-code/issues"

[project.scripts]
dardcor = "pydardcor.cli:main"

[tool.setuptools.packages.find]
include = ["pydardcor", "pydardcor.*"]

[tool.setuptools.package-data]
"pydardcor.extensions" = ["*.json", "*.py"]